<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111b29"><title>The Sea Prince’s Almost Bride · Your eyes · Your touch</title><link rel="stylesheet" href="style.css"></head>
<body><main id="stage" aria-label="Interactive story">
  <div id="picture"><video class="film is-active" id="film" playsinline preload="auto" poster="assets/pov-cover.jpg"></video><video class="film" id="film-buffer" playsinline preload="auto" aria-hidden="true"></video><div id="shade"></div><div id="captions" aria-live="off"></div><div id="transition"></div></div>
  <header><button id="episodes-open" aria-label="Episodes"><span id="chapter">01 · THE TIDE GATE</span> <span>⌄</span></button><div class="tools"><button id="locale" aria-label="Change language">中文</button><button id="pause" aria-label="Pause">Ⅱ</button></div></header>
  <div id="progress"><i></i></div>
  <section id="transport" hidden><div class="transport-row"><span id="time">0:00 / 0:00</span><button id="speed-open" aria-label="Playback speed">1×</button></div><button id="seek" role="slider" aria-label="Episode progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="seek-track"><i id="seek-fill"></i><b id="seek-thumb"></b></span></button><div id="seek-hint"></div></section>
  <section id="panel" class="sheet" role="dialog" aria-modal="true" aria-labelledby="panel-title" hidden><div class="sheet-head"><h2 id="panel-title"></h2><button id="panel-close" aria-label="Close">×</button></div><div id="panel-options"></div></section>
  <section id="cover" class="overlay"><div class="eyebrow" data-en="SKYE’S FIRST-PERSON STORY" data-zh="女主第一人称互动剧">AN INTERACTIVE ROMANCE</div><h1><small>The Sea Prince’s</small>Almost<br><em>Bride</em></h1><p class="tagline" data-en="He is looking at you. Decide how close he gets." data-zh="让他走进你的视线，也让他回应你的选择。">Find a friend. Become an unexpected bride.</p><button id="start" class="primary" data-en="Meet him" data-zh="走近他">Enter the tide gate</button><button id="continue-story" class="secondary" hidden data-en="Continue your story" data-zh="继续上次的故事">Continue your story</button><p class="hint" data-en="Five episodes · Your eyes · Your choices" data-zh="新版 · 女主 POV · 点击互动">New cut · First person · Click to respond</p></section>
  <section id="decision" hidden><div class="decision-kicker" data-en="YOUR MOMENT" data-zh="由你决定">YOUR MOMENT</div><h2></h2><div id="options"></div><div id="clock" hidden><i></i></div></section>
  <section id="paused" class="center-overlay" hidden><button id="resume" class="primary" data-en="Continue" data-zh="继续播放">Continue</button></section>
  <section id="error" class="center-overlay" hidden><p data-en="The next moment could not load." data-zh="下一段暂时加载失败。">The next moment could not load.</p><button id="retry" class="primary" data-en="Try again" data-zh="重新加载">Try again</button></section>
  <div id="loading" hidden><span></span><p data-en="The tide is turning…" data-zh="潮水正在转向……">The tide is turning…</p></div>
  <section id="episode-end" class="episode-complete" role="dialog" aria-modal="true" aria-labelledby="episode-end-title" hidden>
    <div class="episode-end-card"><div class="eyebrow" data-en="EPISODE COMPLETE" data-zh="本集结束">EPISODE COMPLETE</div><h2 id="episode-end-title"></h2><p id="next-episode-title"></p><button id="next-episode" class="primary" data-en="Next episode" data-zh="下一集">Next episode</button><button id="replay-episode" class="secondary" data-en="Replay this episode" data-zh="重看本集">Replay this episode</button><button id="episode-menu" class="secondary" data-en="Choose an episode" data-zh="选集">Choose an episode</button></div>
  </section>
  <section id="ending" class="overlay" hidden><div class="eyebrow" data-en="TO BE CONTINUED" data-zh="待续">TO BE CONTINUED</div><h2 id="ending-title"></h2><p id="result"></p><p id="memories" class="tagline"></p><button id="other-ending" class="primary" hidden data-en="Explore the other ending" data-zh="体验另一个结局">Explore the other ending</button><button id="replay" class="secondary" data-en="Start a new story" data-zh="重新开始故事">Start a new story</button></section>
  <footer hidden><span id="shot-status"></span><button id="restart" data-en="Restart" data-zh="重新开始">Restart</button></footer>
</main><script src="app.js"></script></body></html>
